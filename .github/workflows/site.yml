name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML
        run: >
          npx --yes html-validate@9.7.1
          index.html resume.html 404.html
          'projects/*.html' enterprise-data-platform/index.html

      - name: Stylesheet version stamps are current
        run: |
          bash scripts/bump-css-version.sh
          git diff --exit-code -- '*.html'

      # 404.html uses absolute /data-engineering-portfolio/ paths, so the site
      # is staged under that prefix before links are checked.
      - name: Stage site under its published path
        run: |
          mkdir -p _site/data-engineering-portfolio
          git archive HEAD | tar -x -C _site/data-engineering-portfolio

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --root-dir ${{ github.workspace }}/_site
            '_site/**/*.html' '_site/**/*.md'
          fail: true
